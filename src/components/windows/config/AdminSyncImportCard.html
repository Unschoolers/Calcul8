<v-row v-if="canUseAdminLotSyncTools()" class="mt-1">
  <v-col cols="12">
    <v-card elevation="2" class="config-card">
      <v-card-title class="text-subtitle-1">
        <v-icon class="mr-2">mdi-database-import-outline</v-icon>
        Admin Sync Import
      </v-card-title>
      <v-divider></v-divider>
      <v-card-text>
        <app-form-layout compact>
          <template #helper>
            <div class="text-caption text-medium-emphasis app-text-wrap">
              Copy cloud sync data from a source userId into your current personal account or active workspace (debug tool).
            </div>
            <div class="text-caption text-medium-emphasis app-text-wrap">
              Target:
              <strong v-if="activeScopeType === 'workspace' && activeWorkspaceId" class="app-long-token">
                Workspace {{ currentWorkspaceName || activeWorkspaceId }}
              </strong>
              <strong v-else>Personal account</strong>
            </div>
          </template>
          <div class="app-form-row">
            <v-text-field
              v-model="adminImportSourceUserId"
              label="Source userId"
              variant="outlined"
              density="compact"
              hide-details
              autocomplete="off"
            ></v-text-field>
            <v-text-field
              v-model="adminImportSourceWorkspaceId"
              label="Source workspaceId"
              placeholder="Leave empty for personal source"
              variant="outlined"
              density="compact"
              hide-details
              autocomplete="off"
            ></v-text-field>
          </div>
          <template #actions>
            <v-btn
              class="app-touch-target"
              block
              color="warning"
              prepend-icon="mdi-database-sync"
              :loading="isAdminImportInProgress"
              @click="importLotsFromUserId"
            >
              Import from userId
            </v-btn>
          </template>
        </app-form-layout>
      </v-card-text>
    </v-card>
  </v-col>
</v-row>
