<app-dialog-shell
  v-if="gameSpectatorDialog"
  v-model="gameSpectatorDialog"
  :title="t('gameSpectatorDialogTitle')"
  :max-width="480"
  class="game-spectator-dialog"
>
    <div class="text-body-2">
      <div class="game-spectator-dialog__intro">
        <div>{{ gameSpectatorDialogHint }}</div>
        <div
          v-if="gameSpectatorSessionId"
          class="game-spectator-dialog__status app-status-chip"
          :class="`game-spectator-dialog__status--${gameSpectatorSessionStatus}`"
        >
          {{
            gameSpectatorSessionStatus === 'ended'
              ? t('gameSpectatorStatusEnded')
              : gameSpectatorSessionStatus === 'live'
                ? t('gameSpectatorStatusLive')
                : t('gameSpectatorStatusStarting')
          }}
        </div>
      </div>

      <template v-if="gameSpectatorSessionId">
        <div class="game-spectator-dialog__qr-wrap">
          <img
            :src="gameSpectatorSessionQrUrl"
            :alt="t('gameSpectatorQrAlt')"
            class="game-spectator-dialog__qr"
          >
        </div>
        <div class="game-spectator-dialog__url">
          {{ gameSpectatorSessionUrl }}
        </div>
      </template>
    </div>
    <template #actions>
      <div class="game-spectator-dialog__actions d-flex align-center flex-wrap flex-grow-1">
        <v-spacer></v-spacer>
        <app-action-button
          v-if="!gameSpectatorSessionId || gameSpectatorSessionStatus === 'ended'"
          action="live"
          :loading="gameSpectatorPublishPending"
          :label="gameSpectatorStartButtonLabel"
          @click="startGameSpectatorMode"
        >
          {{ gameSpectatorStartButtonLabel }}
        </app-action-button>
        <template v-if="gameSpectatorSessionId">
          <app-action-button
            action="copy"
            variant="text"
            :label="t('gameSpectatorCopyAction')"
            @click="copyGameSpectatorLink"
          >
            {{ t('gameSpectatorCopyAction') }}
          </app-action-button>
          <app-action-button
            action="open"
            variant="text"
            :label="t('gameSpectatorOpenAction')"
            @click="openGameSpectatorPage"
          >
            {{ t('gameSpectatorOpenAction') }}
          </app-action-button>
          <app-action-button
            v-if="gameSpectatorSessionStatus !== 'ended'"
            action="delete"
            :loading="gameSpectatorPublishPending"
            :label="t('gameSpectatorEndAction')"
            @click="endGameSpectatorMode"
          >
            {{ t('gameSpectatorEndAction') }}
          </app-action-button>
        </template>
        <app-action-button
          action="close"
          variant="text"
          :label="t('commonClose')"
          @click="closeGameSpectatorDialog"
        >
          {{ t('commonClose') }}
        </app-action-button>
      </div>
    </template>
</app-dialog-shell>
