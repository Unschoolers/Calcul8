<app-section-card
  variant="outlined"
  :card-class="['wheel-inspector-panel', { 'wheel-inspector-panel--mobile-open': game.view.wheelMobileInspectorOpen }]"
  title-class="wheel-panel-title app-section-title-bar"
  content-class="wheel-inspector-panel__body"
  divider
>
  <template #header>
    <div class="wheel-inspector-mobile-handle" aria-hidden="true"></div>
    <div class="wheel-panel-title__row">
      <div class="wheel-panel-title__copy">
        <div class="wheel-panel-heading">
          <v-icon start size="small">{{ game.view.wheelInspectorPanelMeta.icon }}</v-icon>
          {{ game.view.wheelInspectorPanelMeta.title }}
        </div>
        <div class="wheel-panel-subtitle">
          {{ game.view.wheelInspectorPanelMeta.subtitle }}
        </div>
      </div>
      <v-btn
        icon="mdi-close"
        size="small"
        variant="text"
        class="wheel-inspector-mobile-close"
        @click="game.commands.closeWheelInspector"
      ></v-btn>
    </div>
  </template>
    <v-btn-toggle
      v-if="!game.view.wheelIsCompactLayout"
      :model-value="game.view.wheelInspectorTab"
      mandatory
      divided
      density="comfortable"
      variant="outlined"
      class="wheel-inspector-toggle"
      @update:model-value="setWheelInspectorTab($event)"
    >
      <v-btn v-for="tab in game.view.wheelInspectorTabItems" :key="tab.id" :value="tab.id" size="small">
        <v-icon start size="small">{{ tab.icon }}</v-icon>
        {{ tab.label }}
      </v-btn>
    </v-btn-toggle>

    <section v-show="game.view.wheelInspectorTab === 'config'" class="wheel-panel-section">

      <template v-if="game.view.editingWheelConfig">
        <bracket-battle-builder
          v-if="game.view.editingWheelConfig.gameType === 'bracket'"
          :ctx="game.view"
        ></bracket-battle-builder>

        <template v-else>
        <app-form-layout compact :responsive="false">
        <div class="wheel-compact-settings app-form-row">
          <div class="wheel-compact-setting">
            <div class="wheel-compact-setting__label app-text-wrap">{{ game.view.t('wheelInspectorSpinPriceLabel') }}</div>
            <v-text-field v-model.number="game.view.editingWheelConfig.spinPrice" type="number"
              :aria-label="game.view.t('wheelInspectorSpinPriceLabel')"
              min="0.5" step="0.5" variant="outlined" density="compact"
              hide-details="auto"></v-text-field>
          </div>
          <div class="wheel-compact-setting">
            <div class="wheel-compact-setting__label app-text-wrap">{{ game.view.t('wheelInspectorOutcomeCountLabel') }}</div>
            <v-text-field v-model.number="game.view.editingWheelConfig.outcomeCount"
              :aria-label="game.view.t('wheelInspectorOutcomeCountLabel')"
              type="number" min="4" max="200" step="1" variant="outlined" density="compact"
              hide-details="auto"></v-text-field>
          </div>
        </div>
        </app-form-layout>

        <v-divider class="my-2"></v-divider>
        <div class="wheel-section-heading">
          <div>
            <div class="wheel-section-title">{{ game.view.t('wheelInspectorWheelTiersTitle') }}</div>
            <div class="wheel-section-subtitle">{{ game.view.t('wheelOddsSubtitle') }}</div>
          </div>
          <span
            class="wheel-odds-total-badge"
            :class="{ 'wheel-odds-total-badge--valid': wheelOddsTotalValid }"
          >
            {{ wheelOddsTotalDisplay }}
          </span>
        </div>

        <div v-if="wheelBuilderTierGroups.length" class="wheel-builder-groups">
          <div
            v-for="group in wheelBuilderTierGroups"
            :key="group.key"
            class="wheel-builder-group"
          >
            <div class="wheel-builder-group__header">
              <div class="wheel-builder-group__copy">
                <div class="wheel-builder-group__title-row">
                  <v-icon size="16" class="wheel-builder-group__icon">
                    {{ group.key === 'unassigned' ? 'mdi-alert-circle-outline' : 'mdi-database-outline' }}
                  </v-icon>
                  <div class="wheel-builder-group__title">{{ group.title }}</div>
                  <v-menu v-if="group.sourceLotNames?.length" location="bottom">
                    <template #activator="{ props }">
                      <v-btn
                        v-bind="props"
                        icon="mdi-information-outline"
                        size="x-small"
                        variant="text"
                        class="wheel-builder-group__info"
                        :aria-label="game.view.t('wheelInspectorMultiLotInfoLabel')"
                      ></v-btn>
                    </template>
                    <v-list density="compact" class="wheel-builder-group__source-list">
                      <v-list-item
                        v-for="name in group.sourceLotNames"
                        :key="name"
                        :title="name"
                      ></v-list-item>
                    </v-list>
                  </v-menu>
                  <span class="wheel-builder-group__count">{{ group.countLabel }}</span>
                </div>
                <div class="wheel-builder-group__detail">{{ group.detail }}</div>
              </div>
            </div>

            <div class="wheel-builder-group__tiers">
              <wheel-tier-card
                v-for="entry in group.tiers"
                :key="entry.tier.id"
                :ctx="game.view"
                :tier="entry.tier"
                :tier-index="entry.index"
              ></wheel-tier-card>
            </div>
          </div>
        </div>

        <v-btn size="small" variant="text" color="primary" prepend-icon="mdi-plus" class="mt-1"
          @click="game.commands.addTier">
          {{ game.view.t('wheelInspectorAddTierAction') }}
        </v-btn>
        </template>
      </template>

      <v-alert v-else type="info" variant="tonal" density="compact" class="mt-2">
        {{ game.view.t('wheelInspectorEmptyState') }}
      </v-alert>
    </section>

    <wheel-session-panel
      v-show="game.view.wheelInspectorTab === 'session'"
      :ctx="game.view"
    ></wheel-session-panel>

    <section v-show="game.view.wheelInspectorTab === 'history'" class="wheel-panel-section">
      <wheel-history-panel :ctx="game.view"></wheel-history-panel>
    </section>
  </app-section-card>
