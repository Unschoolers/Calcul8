<teleport defer to=".app-shell-action-zone">
<div v-if="active" class="app-context-action-dock">
  <div class="app-context-action-dock__primary-wrap">
    <v-btn
      :icon="primaryAction.icon"
      :color="primaryAction.color"
      size="default"
      elevation="8"
      class="app-context-action-dock__primary"
      :title="primaryAction.label"
      :aria-label="primaryAction.label"
      :disabled="primaryAction.disabled"
      @click="activate(primaryAction.id)"
    ></v-btn>
    <div
      v-if="badgeLabel"
      class="app-context-action-profit-target-badge"
      aria-hidden="true"
    >{{ badgeLabel }}</div>
  </div>

  <v-menu
    v-if="secondaryActions.length"
    v-model="menuOpen"
    location="top end"
    :close-on-content-click="true"
  >
    <template #activator="{ props }">
      <v-btn
        v-bind="props"
        icon="mdi-dots-horizontal"
        color="surface"
        size="default"
        elevation="6"
        class="app-context-action-dock__secondary"
        :title="secondaryLabel"
        :aria-label="secondaryLabel"
      ></v-btn>
    </template>

    <v-list density="compact" class="app-context-action-dock__menu">
      <v-list-item
        v-for="action in secondaryActions"
        :key="action.id"
        :prepend-icon="action.icon"
        :title="action.label"
        :base-color="action.color === 'surface' ? null : action.color"
        :disabled="action.disabled"
        :aria-disabled="action.disabled ? 'true' : null"
        @click="activate(action.id)"
      ></v-list-item>
    </v-list>
  </v-menu>
</div>
</teleport>
