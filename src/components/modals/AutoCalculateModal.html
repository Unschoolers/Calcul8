<app-dialog-shell v-model="showProfitCalculator" :title="t('priceCalculatorTitle')" :max-width="400">
  <template #title>
    <div class="d-flex align-center app-text-wrap">
      <v-icon class="mr-2">mdi-calculator</v-icon>
      {{ t('priceCalculatorTitle') }}
    </div>
  </template>
  <app-form-layout compact>
    <div>
      <v-text-field
        v-model.number="targetProfitPercent"
        :label="t('configTargetProfitLabel') + ' %'"
        type="number"
        variant="outlined"
        :disabled="!canUsePaidActions"
        suffix="%"
        :min="0"
        :max="100"
        :hint="t('priceCalculatorRoundHint')"
        persistent-hint
      ></v-text-field>
      <v-alert
        v-if="hasLotSelected && !hasProAccess"
        type="info"
        variant="tonal"
        density="compact"
        icon="mdi-lock"
        class="mt-3"
      >
        {{ t('priceCalculatorProNotice') }}
        <div class="mt-2">
          <v-btn
            size="small"
            color="primary"
            variant="flat"
            prepend-icon="mdi-google-play"
            :loading="isVerifyingPurchase"
            @click="startProPurchase"
          >
            {{ t('priceCalculatorUnlockProAction') }}
          </v-btn>
        </div>
        <div v-if="showManualPurchaseVerify" class="mt-2">
          <v-btn size="small" variant="text" prepend-icon="mdi-check-decagram" @click="openVerifyPurchaseModal">
            {{ t('priceCalculatorVerifyAction') }}
          </v-btn>
        </div>
      </v-alert>
    </div>
    <template #actions>
      <v-spacer></v-spacer>
      <v-btn text @click="showProfitCalculator = false">{{ t('commonCancel') }}</v-btn>
      <v-btn color="secondary" @click="calculateOptimalPrices" :disabled="!canUsePaidActions">{{ t('commonApply') }}</v-btn>
    </template>
  </app-form-layout>
</app-dialog-shell>
