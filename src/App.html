<v-app>
      <template v-if="isGoogleSignedIn">
        <app-shell-top-bar></app-shell-top-bar>

        <v-main id="app-main" class="app-shell-root" tabindex="-1"
          :data-has-context-actions="hasVisibleContextActions ? 'true' : 'false'">
          <v-container fluid class="pa-4 app-shell app-shell-content-zone fill-height">
            <v-alert v-if="isOffline" type="warning" variant="tonal" density="compact" class="app-shell-offline-notice mb-3">
              {{ t('shellOfflineNotice') }}
            </v-alert>

            <lot-selector-onboarding-block></lot-selector-onboarding-block>


            <!-- Tab Content -->
            <div class="app-shell-tab-zone">
              <v-window v-model="currentTab"
                :class="['tabs-window', { 'tabs-window--allow-sticky': currentTab === 'wheel' || currentTab === 'portfolio' || (currentLotType === 'singles' && (currentTab === 'live' || currentTab === 'config')) }]"
                transition="tab-slide-fast" reverse-transition="tab-slide-fast-reverse">
                <!-- CONFIG -->
                <v-window-item key="config" value="config" eager>
                  <singles-config-window v-if="hasLotSelected && currentLotType === 'singles'" ref="singlesConfigWindow"></singles-config-window>
                  <config-window v-else></config-window>
                </v-window-item>

                <!-- LIVE -->
                <v-window-item key="live" value="live" eager>
                  <live-window ref="liveWindow"></live-window>
                </v-window-item>

                <!-- SALES -->
                <v-window-item key="sales" value="sales" eager>
                  <sales-window ref="salesWindow"></sales-window>
                </v-window-item>

                <!-- WHEEL -->
                <v-window-item key="wheel" value="wheel" eager>
                  <game-window ref="wheelWindow"></game-window>
                </v-window-item>

                <!-- PORTFOLIO -->
                <v-window-item key="portfolio" value="portfolio" eager>
                  <portfolio-window ref="portfolioWindow"></portfolio-window>
                </v-window-item>

              </v-window>
            </div>

            
          </v-container>

          <!-- Bottom Nav -->
          <v-bottom-navigation :model-value="currentTab" @update:model-value="selectPrimaryTab" class="app-shell-bottom-nav" color="primary" grow elevation="8" mandatory
            :aria-label="t('shellPrimaryNavigationAriaLabel')">
            <v-btn value="config" :ripple="false">
              <v-icon>mdi-cog</v-icon>
              <span class="app-shell-nav-label app-shell-nav-label--desktop">{{ t('shellNavConfigLabel') }}</span>
              <span class="app-shell-nav-label app-shell-nav-label--mobile">{{ t('shellNavLotLabel') }}</span>
            </v-btn>
            <v-btn value="live" :aria-disabled="!hasLotSelected" :class="{ 'app-shell-nav-item--unavailable': !hasLotSelected }" :ripple="false">
              <v-icon>mdi-target</v-icon>
              <span>{{ t('shellNavLiveLabel') }}</span>
            </v-btn>

            <v-btn value="sales" :aria-disabled="!hasLotSelected" :class="{ 'app-shell-nav-item--unavailable': !hasLotSelected }" :ripple="false">
              <v-icon>mdi-chart-line</v-icon>
              <span>{{ t('shellNavSalesLabel') }}</span>
            </v-btn>

            <v-btn value="wheel" :aria-disabled="!hasLotSelected" :class="{ 'app-shell-nav-item--unavailable': !hasLotSelected }" :ripple="false">
              <v-icon>mdi-gamepad-variant-outline</v-icon>
              <span>{{ t('shellNavWheelLabel') }}</span>
            </v-btn>

            <v-btn value="portfolio" :aria-disabled="!hasLotSelected" :class="{ 'app-shell-nav-item--unavailable': !hasLotSelected }" :ripple="false">
              <v-icon>mdi-briefcase-outline</v-icon>
              <span>{{ t('shellNavPortfolioLabel') }}</span>
            </v-btn>



          </v-bottom-navigation>
        </v-main>

        <div class="app-shell-action-zone" :aria-label="t('shellContextActionsAriaLabel')">
        <v-fab
          v-if="currentTab === 'config' && currentLotType === 'singles'"
          id="guided-onboarding-singles-add-fab"
          data-driver-target="guided-onboarding-singles-add-fab"
          icon="mdi-plus"
          color="primary"
          size="large"
          :title="t('shellAddSinglesPurchaseAction')"
          :aria-label="t('shellAddSinglesPurchaseAction')"
          :disabled="!hasLotSelected"
          @click="$refs.singlesConfigWindow?.handleAddSinglesPurchase?.()"
          class="app-context-action app-context-action--slot-1"
        ></v-fab>

        <!-- Primary FAB - Sales -->
        <div v-if="currentTab === 'sales' && hasProAccess" class="app-context-action-wrap app-context-action--slot-1">
          <v-speed-dial v-model="speedDialOpenSales" location="top center" transition="scale-transition"
            :open-on-hover="false" :close-on-content-click="false">
            <template v-slot:activator="{ props: activatorProps }">
              <v-fab v-bind="activatorProps" icon="mdi-cart-plus" color="primary" size="large" :title="t('saleEditorAddTitle')"
                :aria-label="t('saleEditorAddTitle')" :disabled="!hasLotSelected"></v-fab>
            </template>

            <v-btn v-if="currentLotType === 'singles'" :key="'card'" icon="mdi-cards-outline" color="primary"
              variant="elevated" size="small" class="sales-speed-action" :title="t('shellAddItemSaleAction')"
              :aria-label="t('shellAddItemSaleAction')" :disabled="!hasLotSelected"
              @click="openAddSaleModal('pack'); speedDialOpenSales = false"></v-btn>
            <template v-else>
              <v-btn :key="'item'" icon="mdi-tag-outline" color="primary" variant="elevated" size="small"
                class="sales-speed-action" :title="t('shellAddItemSaleAction')" :aria-label="t('shellAddItemSaleAction')"
                :disabled="!hasLotSelected" @click="openAddSaleModal('pack'); speedDialOpenSales = false"></v-btn>
              <v-btn :key="'box'" icon="mdi-cube-outline" color="secondary" variant="elevated" size="small"
                class="sales-speed-action" :title="t('shellAddBoxSaleAction')" :aria-label="t('shellAddBoxSaleAction')"
                :disabled="!hasLotSelected" @click="openAddSaleModal('box'); speedDialOpenSales = false"></v-btn>
              <v-btn :key="'rtyh'" icon="mdi-cards-playing-outline" color="success" variant="elevated" size="small"
                class="sales-speed-action" :title="t('shellAddRtyhSaleAction')" :aria-label="t('shellAddRtyhSaleAction')"
                :disabled="!hasLotSelected" @click="openAddSaleModal('rtyh'); speedDialOpenSales = false"></v-btn>
            </template>
          </v-speed-dial>
        </div>

        <v-fab v-else-if="currentTab === 'sales'" icon="mdi-cart-plus" color="primary" size="large"
          :title="t('shellUpgradeSalesTrackingAction')" :aria-label="t('shellUpgradeSalesTrackingAction')"
          :disabled="!hasLotSelected" @click="accessProFeature('salesTracking')" class="app-context-action app-context-action--slot-1"></v-fab>

        <v-fab v-if="currentTab === 'portfolio'" icon="mdi-table" color="primary" size="large" :title="!hasPortfolioData
          ? t('shellOpenPortfolioReportAction')
          : (hasProAccess ? t('shellOpenPortfolioReportAction') : t('shellUpgradePortfolioReportAction'))" :aria-label="!hasPortfolioData
          ? t('shellOpenPortfolioReportAction')
          : (hasProAccess ? t('shellOpenPortfolioReportAction') : t('shellUpgradePortfolioReportAction'))"
          :disabled="!hasPortfolioData" @click="accessProFeature('portfolioReport')"
          class="app-context-action app-context-action--slot-1"></v-fab>
        </div>

        <workspace-modals></workspace-modals>
        <system-configuration-dialog></system-configuration-dialog>

        <!-- New Lot Modal -->
        <app-dialog-shell v-model="showNewLotModal" :title="t('newLotTitle')" :max-width="400">
          <app-form-layout id="guided-onboarding-new-lot-card" data-driver-target="guided-onboarding-new-lot-card">
              <v-text-field id="guided-onboarding-lot-name-field" v-model="lotNameDraft" :label="t('lotNameLabel')" variant="outlined"
                @keyup.enter="createNewLot"></v-text-field>
              <v-btn-toggle v-model="newLotType" mandatory divided density="compact" variant="outlined"
                class="mt-2 segment-toggle app-form-row app-responsive-segment-toggle">
                <v-btn class="app-touch-target" value="bulk" size="small">{{ t('commonBulk') }}</v-btn>
                <v-btn class="app-touch-target" value="singles" size="small">{{ t('commonSingles') }}</v-btn>
              </v-btn-toggle>
              <div v-if="newLotType === 'singles'" class="mt-3">
                <div class="text-caption text-medium-emphasis mb-2">{{ t('itemCatalogSourceLabel') }}</div>
                <v-btn-toggle v-model="newLotCatalogSource" mandatory divided density="compact" variant="outlined"
                  class="segment-toggle app-responsive-segment-toggle">
                  <v-btn class="app-touch-target" value="none" size="small">{{ t('itemCatalogCustom') }}</v-btn>
                  <v-btn class="app-touch-target" value="ua" size="small">{{ t('itemCatalogUnionArena') }}</v-btn>
                  <v-btn class="app-touch-target" value="pokemon" size="small">{{ t('itemCatalogPokemon') }}</v-btn>
                </v-btn-toggle>
              </div>
            <template #actions>
              <v-spacer></v-spacer>
              <v-btn class="app-touch-target" variant="text" @click="showNewLotModal = false">{{ t('commonCancel') }}</v-btn>
              <v-btn id="guided-onboarding-create-lot-btn" class="app-touch-target" color="primary" @click="createNewLot">{{ t('commonCreate') }}</v-btn>
            </template>
          </app-form-layout>
        </app-dialog-shell>

        <!-- Edit Lot Modal -->
        <app-dialog-shell v-model="showRenameLotModal" :title="t('editLotTitle')" :max-width="400">
          <app-form-layout>
              <v-text-field v-model="renameLotName" :label="t('lotNameLabel')" variant="outlined"
                @keyup.enter="renameCurrentLot"></v-text-field>
              <div v-if="currentLotType === 'singles'" class="mt-3">
                <div class="text-caption text-medium-emphasis mb-2">{{ t('itemCatalogSourceLabel') }}</div>
                <v-btn-toggle :model-value="currentLotCatalogSource" mandatory divided density="compact"
                  variant="outlined" class="segment-toggle app-responsive-segment-toggle" @update:model-value="setCurrentLotCatalogSource">
                  <v-btn class="app-touch-target" value="none" size="small">{{ t('itemCatalogCustom') }}</v-btn>
                  <v-btn class="app-touch-target" value="ua" size="small">{{ t('itemCatalogUnionArena') }}</v-btn>
                  <v-btn class="app-touch-target" value="pokemon" size="small">{{ t('itemCatalogPokemon') }}</v-btn>
                </v-btn-toggle>
                <div class="text-caption text-medium-emphasis mt-2">
                  {{
                  currentLotCatalogSource === 'none'
                  ? t('itemCatalogAutocompleteDisabledHelp')
                  : t('itemCatalogAutocompleteEnabledHelp')
                  }}
                </div>
              </div>
            <template #actions>
              <v-btn class="app-touch-target" variant="text" color="error" :disabled="!currentLotId"
                @click="showRenameLotModal = false; deleteCurrentLot()">
                {{ t('commonDelete') }}
              </v-btn>
              <v-spacer></v-spacer>
              <v-btn class="app-touch-target" variant="text" @click="showRenameLotModal = false">{{ t('commonCancel') }}</v-btn>
              <v-btn class="app-touch-target" color="primary" @click="renameCurrentLot">{{ t('commonSave') }}</v-btn>
            </template>
          </app-form-layout>
        </app-dialog-shell>

        <!-- Verify Play Purchase Modal -->
        <app-dialog-shell v-if="showManualPurchaseVerify" v-model="showVerifyPurchaseModal"
          :title="t('purchaseVerifyTitle')" :max-width="520">
          <template #title>
              <v-icon class="mr-2">mdi-check-decagram</v-icon>
              {{ t('purchaseVerifyTitle') }}
          </template>
          <app-form-layout>
              <v-text-field v-model="purchaseTokenInput" :label="t('purchaseTokenLabel')" variant="outlined" autocomplete="off"
                class="mb-2" :hint="t('purchaseTokenHint')" persistent-hint></v-text-field>
              <v-text-field v-model="purchaseProductIdInput" :label="t('purchaseProductIdOptionalLabel')" variant="outlined"
                autocomplete="off" class="mb-2"></v-text-field>
              <v-text-field v-model="purchasePackageNameInput" :label="t('purchasePackageNameOptionalLabel')" variant="outlined"
                autocomplete="off"></v-text-field>
            <template #actions>
              <v-spacer></v-spacer>
              <v-btn class="app-touch-target" variant="text" @click="showVerifyPurchaseModal = false">{{ t('commonCancel') }}</v-btn>
              <v-btn class="app-touch-target" color="primary" :loading="isVerifyingPurchase" @click="verifyProPurchase">{{ t('purchaseVerifySubmitAction') }}</v-btn>
            </template>
          </app-form-layout>
        </app-dialog-shell>

        <!-- Embedded Stripe Checkout Modal -->
        <app-dialog-shell v-model="showStripeCheckoutModal" :title="t('stripeCheckoutTitle')" :max-width="560"
          variant="checkout" persistent>
          <template #title>
              <v-icon class="mr-2">mdi-credit-card-lock-outline</v-icon>
              {{ t('stripeCheckoutTitle') }}
          </template>
          <app-form-layout>
            <div id="stripe-embedded-checkout" class="stripe-embedded-checkout"></div>
            <template #actions>
              <v-spacer></v-spacer>
              <v-btn class="app-touch-target" variant="text" @click="closeStripeCheckoutModal">{{ t('stripeCheckoutCancelAction') }}</v-btn>
            </template>
          </app-form-layout>
        </app-dialog-shell>

        <!-- Profit Calculator Modal -->
        <auto-calculate-modal></auto-calculate-modal>

        <sale-editor-modal></sale-editor-modal>

        <portfolio-report-modal></portfolio-report-modal>

        <app-dialog-shell v-model="confirmDialog" :title="confirmTitle" :max-width="420">
          <p class="app-text-wrap">{{ confirmText }}</p>
          <template #actions>
            <v-spacer></v-spacer>
            <v-btn class="app-touch-target" variant="text" @click="cancelConfirmAction">{{ t('commonCancel') }}</v-btn>
            <v-btn class="app-touch-target" :color="confirmColor" @click="runConfirmAction">{{ t('commonConfirm') }}</v-btn>
          </template>
        </app-dialog-shell>

        <whatnot-csv-import-dialog></whatnot-csv-import-dialog>
        <whatnot-review-dialog></whatnot-review-dialog>

        <div class="app-shell-snackbar-zone" aria-live="polite">
          <v-snackbar v-model="showAppUpdatePrompt" color="secondary" location="top" :timeout="-1" role="status"
            aria-live="polite" aria-atomic="true" :close-on-content-click="false">
            {{ t('appUpdateReadyMessage') }}
            <template #actions>
              <v-btn variant="text" @click="dismissAppUpdate">{{ t('commonSkipForNow') }}</v-btn>
              <v-btn variant="flat" color="secondary" @click="applyAppUpdate">{{ t('shellRefreshAction') }}</v-btn>
            </template>
          </v-snackbar>

          <v-snackbar v-model="snackbar.show" :color="snackbar.color" location="bottom" timeout="2400" role="status"
            aria-live="polite" aria-atomic="true">
            {{ snackbar.text }}
          </v-snackbar>
        </div>

      </template>

      <template v-else-if="isAuthSessionResolving">
        <v-main id="app-main" tabindex="-1">
          <v-container fluid class="auth-gate-shell">
            <v-card class="auth-gate-card auth-gate-card--checking" elevation="8" max-width="430">
              <v-card-text class="pa-6 pa-sm-8 text-center">
                <img src="../icons/icon-192.png" alt="" class="auth-gate-logo" />
                <p class="auth-gate-overline text-caption mb-5">WhatFees</p>
                <v-progress-circular
                  indeterminate
                  color="secondary"
                  size="32"
                  width="3"
                  class="auth-gate-checking-spinner mb-4"
                  aria-hidden="true"
                ></v-progress-circular>
                <h1 class="auth-gate-title text-h5 text-sm-h4 font-weight-bold mb-4">
                  {{ t('authCheckingSessionTitle') }}
                </h1>
                <p class="text-body-2 text-medium-emphasis mb-0">
                  {{ t('authCheckingSessionSubtitle') }}
                </p>
              </v-card-text>
            </v-card>
          </v-container>
        </v-main>
      </template>

      <template v-else>
        <auth-gate-card></auth-gate-card>
      </template>
    </v-app>
